<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMT Note</title>
    <!-- PWA 매니페스트 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (가볍고 깔끔한 아이콘) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* 커스텀 스크롤바 디자인 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        
        /* 텍스트 영역 테두리 제거 및 클릭 시 아웃라인 제거 */
        #editor:focus {
            outline: none;
            box-shadow: none;
        }

        /* 모바일에서 텍스트 에디터 자동 확대 방지 */
        input, textarea {
            font-size: 16px !important; 
        }

        /* 기본 다크(Dark) 테마 변수 (다크그레이 & 웜화이트) */
        :root {
            --bg-color: #333333;
            --text-color: #F2F0E9;
            --sidebar-bg: #2a2a2a;
            --header-bg: #222222;
            --border-color: #444444;
            --hover-bg: #444444;
            --input-bg: #444444;
            --icon-color: #bbbbbb;
        }

        /* 라이트(Light) 테마 변수 (Tailwind 기본값과 유사하게 매핑) */
        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #1f2937; /* gray-800 */
            --sidebar-bg: #f9fafb; /* gray-50 */
            --header-bg: #ffffff;
            --border-color: #e5e7eb; /* gray-200 */
            --hover-bg: #f3f4f6; /* gray-100 */
            --input-bg: transparent;
            --icon-color: #9ca3af; /* gray-400 */
        }

        /* 테마 적용 클래스 */
        .theme-bg { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
        .theme-sidebar { background-color: var(--sidebar-bg); border-color: var(--border-color); }
        .theme-header { background-color: var(--header-bg); border-color: var(--border-color); }
        .theme-border { border-color: var(--border-color); }
        .theme-hover:hover { background-color: var(--hover-bg); }
        .theme-icon { color: var(--icon-color); }
        
        .theme-input-container { background-color: var(--input-bg); border-color: var(--border-color); }
        
        textarea#editor {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        input#filenameInput {
            color: var(--text-color);
        }

        /* 테마 변경 버튼 스타일 */
        .theme-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
        }
        .theme-light-btn { background: #ffffff; border: 2px solid #000000; }
        .theme-dark-btn { background: #333333; border: 2px solid #ffffff; }

        /* 사이드바 반응형 접힘/펼침 애니메이션 제어 */
        #sidebar {
            width: 256px;
            transition: margin-left 0.3s ease, transform 0.3s ease;
        }
        
        /* 모바일 환경 (기본: 숨김, mobile-open 클래스 추가 시: 우측으로 슬라이드 인) */
        @media (max-width: 767px) {
            #sidebar {
                position: fixed;
                z-index: 30;
                transform: translateX(-100%);
            }
            #sidebar.mobile-open {
                transform: translateX(0);
            }
        }

        /* 데스크탑(가로) 환경 (기본: 열림, desktop-closed 클래스 추가 시: 좌측으로 밀어내기) */
        @media (min-width: 768px) {
            #sidebar {
                position: relative;
                flex-shrink: 0;
                margin-left: 0;
            }
            #sidebar.desktop-closed {
                margin-left: -256px;
            }
        }

    </style>
</head>
<body class="theme-bg font-sans h-screen w-full overflow-hidden flex flex-col md:flex-row">

    <!-- 모바일 사이드바 배경 오버레이 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="closeSidebar()"></div>

    <!-- 사이드바 -->
    <aside id="sidebar" class="theme-sidebar border-r h-full flex flex-col shadow-lg md:shadow-none">
        <div class="p-4 border-b theme-border flex justify-between items-center theme-header shrink-0">
            <h2 class="font-bold flex items-center gap-2">
                <i class="ph ph-files text-xl theme-icon"></i>
                Files
            </h2>
            <div class="flex items-center gap-3">
                <!-- 테마 변경 버튼 2개 -->
                <div class="flex gap-2">
                    <div class="theme-btn theme-light-btn" onclick="setTheme('light')" title="라이트 테마"></div>
                    <div class="theme-btn theme-dark-btn" onclick="setTheme('dark')" title="다크 테마"></div>
                </div>
                <!-- 닫기 버튼 -->
                <button class="text-current opacity-70 hover:opacity-100 p-1" onclick="toggleSidebar()" title="사이드바 닫기">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- PWA 강제 설치 버튼 -->
        <div class="p-2 border-b theme-border shrink-0">
            <button id="installBtn" class="w-full hidden p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-bold transition-colors">
                <i class="ph ph-download-simple mr-1"></i> 앱 설치하기 (PWA)
            </button>
        </div>

        <!-- 파일 리스트 -->
        <div id="fileList" class="flex-1 overflow-y-auto p-2">
            <!-- 자바스크립트로 파일 목록이 렌더링 됩니다 -->
        </div>

        <!-- 버전 및 제작자 표기 -->
        <div class="p-4 border-t theme-border text-center theme-sidebar shrink-0">
            <strong class="block text-base mb-1">NMT Note</strong>
            <span class="text-xs opacity-60">yomaLapin(202611-001)</span>
        </div>
    </aside>

    <!-- 메인 에디터 영역 -->
    <main class="flex-1 h-full flex flex-col min-w-0 relative z-10 theme-bg transition-all duration-300">
        
        <!-- 툴바 (헤더) -->
        <header class="sticky top-0 z-20 w-full flex items-center justify-between p-2 md:p-3 border-b theme-border theme-header shadow-sm shrink-0">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <button class="p-2 theme-icon theme-hover rounded-md transition-colors" onclick="toggleSidebar()" title="메뉴 열기/닫기">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                
                <div class="flex items-center flex-1 max-w-sm border rounded-md px-3 py-1.5 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all theme-input-container">
                    <i class="ph ph-file-text theme-icon mr-2"></i>
                    <input type="text" id="filenameInput" placeholder="untitled.txt" class="w-full bg-transparent border-none focus:outline-none text-sm md:text-base font-medium placeholder-gray-400" autocomplete="off">
                </div>
            </div>

            <!-- 액션 버튼들 -->
            <div class="flex items-center gap-1.5 md:gap-2 ml-2">
                <button onclick="newFile()" class="px-2 md:px-3 py-1.5 border theme-border rounded shadow-sm theme-hover transition-colors font-bold uppercase text-xs md:text-sm tracking-wide text-current" title="새 파일">
                    new
                </button>

                <!-- 숨겨진 파일 입력 필드 (로컬 기기에서 불러오기 용) -->
                <input type="file" id="fileInput" class="hidden" onchange="importFile(event)">
                <button onclick="document.getElementById('fileInput').click()" class="px-2 md:px-3 py-1.5 border theme-border rounded shadow-sm theme-hover transition-colors font-bold uppercase text-xs md:text-sm tracking-wide text-current" title="기기에서 불러오기">
                    load
                </button>

                <button onclick="saveToLocalStorage()" class="px-2 md:px-3 py-1.5 border border-blue-500 text-blue-500 hover:bg-blue-600 hover:text-white rounded shadow-sm transition-colors font-bold uppercase text-xs md:text-sm tracking-wide" title="브라우저에 저장">
                    save
                </button>

                <button onclick="exportFile()" class="px-2 md:px-3 py-1.5 border theme-border rounded shadow-sm theme-hover transition-colors font-bold uppercase text-xs md:text-sm tracking-wide text-current" title="기기로 다운로드">
                    down
                </button>
            </div>
        </header>

        <!-- 에디터 (Textarea) -->
        <div class="flex-1 flex w-full relative min-h-0">
            <textarea id="editor" class="w-full h-full p-4 md:p-6 resize-none font-mono text-sm md:text-base leading-relaxed overflow-y-auto" placeholder="내용을 입력하세요... (코드를 작성하거나 메모를 남겨보세요)" spellcheck="false"></textarea>
        </div>
    </main>

    <!-- 커스텀 알림 모달 -->
    <div id="msgModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-200 text-gray-800">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="msgModalContent">
            <div class="p-5">
                <h3 class="text-lg font-bold mb-2" id="msgTitle">알림</h3>
                <p class="text-gray-600 text-sm md:text-base" id="msgText">메시지 내용</p>
            </div>
            <div class="px-5 py-3 bg-gray-50 border-t border-gray-200 rounded-b-lg flex justify-end gap-2">
                <button id="msgCancelBtn" class="hidden px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-100 transition-colors" onclick="closeMsg()">취소</button>
                <button id="msgOkBtn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 transition-colors" onclick="confirmMsg()">확인</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 테마(배경색) 설정 로직 ---
        function setTheme(themeName) {
            if (themeName === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            localStorage.setItem('nmtnote_theme', themeName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('nmtnote_theme');
            if (savedTheme === 'light') {
                setTheme('light');
            } else {
                setTheme('dark');
            }
            loadFilesFromStorage();
            renderFileList();
            
            if (Object.keys(savedFiles).length === 0) {
                newFile();
            }
        });

        // --- 2. PWA 설치 로직 ---
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                installBtn.style.display = 'block';
                installBtn.classList.remove('hidden');
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        // DOM 요소 캐싱
        const editor = document.getElementById('editor');
        const filenameInput = document.getElementById('filenameInput');
        const fileListContainer = document.getElementById('fileList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // NMT Note 전용 저장소 접두어 사용 (충돌 방지)
        const STORAGE_PREFIX = 'nmtnote_file_';
        let savedFiles = {};
        let currentEditingFile = null;

        // --- 3. 사이드바 제어 로직 ---
        function toggleSidebar() {
            if (window.innerWidth < 768) {
                sidebar.classList.toggle('mobile-open');
                if (sidebar.classList.contains('mobile-open')) {
                    sidebarOverlay.classList.remove('hidden');
                } else {
                    sidebarOverlay.classList.add('hidden');
                }
            } else {
                sidebar.classList.toggle('desktop-closed');
            }
        }

        function closeSidebar() {
            if (window.innerWidth < 768) {
                sidebar.classList.remove('mobile-open');
                sidebarOverlay.classList.add('hidden');
            } else {
                sidebar.classList.add('desktop-closed');
            }
        }

        // --- 파일 관리 로직 ---
        function loadFilesFromStorage() {
            savedFiles = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(STORAGE_PREFIX)) {
                    const displayFileName = key.replace(STORAGE_PREFIX, '');
                    savedFiles[displayFileName] = localStorage.getItem(key);
                }
            }
        }

        function saveFilesToStorage(filename, content) {
            try {
                localStorage.setItem(STORAGE_PREFIX + filename, content);
                loadFilesFromStorage(); 
                renderFileList();
            } catch (e) {
                showMsg('저장 실패', '기기 저장 공간이 부족하거나 오류가 발생했습니다.');
            }
        }

        function newFile() {
            editor.value = '';
            filenameInput.value = 'untitled.txt';
            currentEditingFile = null;
            if (window.innerWidth < 768) closeSidebar();
        }

        function saveToLocalStorage() {
            let filename = filenameInput.value.trim();
            const content = editor.value;

            if (!filename) {
                filename = 'untitled.txt';
                filenameInput.value = filename;
            }

            saveFilesToStorage(filename, content);
            currentEditingFile = filename;
            showMsg('저장 완료', `[${filename}] 브라우저에 저장되었습니다.`);
        }

        function openFile(filename) {
            if (savedFiles[filename] !== undefined) {
                editor.value = savedFiles[filename];
                filenameInput.value = filename;
                currentEditingFile = filename;
                if (window.innerWidth < 768) closeSidebar();
            }
        }

        function deleteFile(filename, event) {
            event.stopPropagation();
            
            showMsg('파일 삭제', `[${filename}] 파일을 삭제하시겠습니까?`, true, function() {
                localStorage.removeItem(STORAGE_PREFIX + filename);
                loadFilesFromStorage(); 
                renderFileList();
                
                if (currentEditingFile === filename) {
                    newFile();
                }
            });
        }

        // --- 외부 기기 파일 연동 ---
        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                editor.value = content;
                filenameInput.value = file.name;
                currentEditingFile = null; 
                saveToLocalStorage();
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // 🌟 아이패드 사파리 강제 .txt 덧붙임 방지 수정
        function exportFile() {
            const content = editor.value;
            let filename = filenameInput.value.trim() || 'untitled.txt';
            
            // MIME 타입을 application/octet-stream으로 지정하여 사파리가 확장자를 강제 변경하지 못하도록 조치
            const blob = new Blob([content], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- UI 렌더링 및 인터랙션 ---
        function renderFileList() {
            fileListContainer.innerHTML = '';
            const filenames = Object.keys(savedFiles);
            
            if (filenames.length === 0) {
                fileListContainer.innerHTML = `
                    <div class="text-center opacity-60 text-sm mt-10">
                        <i class="ph ph-folder-open text-4xl mb-2"></i><br>
                        저장된 파일이 없습니다.
                    </div>
                `;
                return;
            }

            filenames.forEach(filename => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-2 mb-1 rounded cursor-pointer theme-hover transition-colors';
                
                let icon = 'ph-file-text';
                if(filename.endsWith('.html')) icon = 'ph-file-html';
                else if(filename.endsWith('.js')) icon = 'ph-file-js';
                else if(filename.endsWith('.py')) icon = 'ph-file-code';
                
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1" onclick="openFile('${filename}')">
                        <i class="ph ${icon} theme-icon text-lg flex-shrink-0"></i>
                        <span class="text-sm truncate font-medium text-current">${filename}</span>
                    </div>
                    <button class="p-2 transition-colors hover:text-red-500" style="color: var(--text-color); opacity: 0.7;" onclick="deleteFile('${filename}', event)">
                        <i class="ph ph-trash text-lg"></i>
                    </button>
                `;
                fileListContainer.appendChild(item);
            });
        }

        // Tab 키 띄어쓰기 4칸 적용
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // --- 커스텀 모달 ---
        let msgConfirmCallback = null;

        function showMsg(title, text, isConfirm = false, onConfirm = null) {
            const modal = document.getElementById('msgModal');
            const content = document.getElementById('msgModalContent');
            const titleEl = document.getElementById('msgTitle');
            const textEl = document.getElementById('msgText');
            const cancelBtn = document.getElementById('msgCancelBtn');

            titleEl.textContent = title;
            textEl.textContent = text;
            
            if (isConfirm) {
                cancelBtn.classList.remove('hidden');
                msgConfirmCallback = onConfirm;
            } else {
                cancelBtn.classList.add('hidden');
                msgConfirmCallback = null;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeMsg() {
            const modal = document.getElementById('msgModal');
            const content = document.getElementById('msgModalContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function confirmMsg() {
            if(msgConfirmCallback) {
                msgConfirmCallback(); 
                msgConfirmCallback = null;
            }
            closeMsg(); 
        }

        // --- 서비스 워커 등록 ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    console.log('NMT Note Service Worker 등록 완료', reg);
                }).catch((err) => {
                    console.log('Service Worker 등록 실패', err);
                });
            });
        }
    </script>
</body>
</html>
